name: Test

on:
  pull_request:
  push:
    branches: [main]
    paths: ["scripts/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test scripts/
